# Autologin del usuario "user" en tty1 — es el que arranca el kiosk
# (ver /home/user/.bash_profile). Sin esto, cada boot pediría login manual,
# rompiendo el "metés el USB, prendés, aparece la herramienta" que
# definimos en la revisión arquitectónica.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
